# Mises à jour des dépendances — voir docs/decisions/ADR-0052-surveillance-des-failles.md
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "detector"
    schedule:
      interval: "weekly"
      day: "monday"
    # Une version publiée depuis moins de 7 jours n'est pas proposée (paquet compromis retiré entre-temps)
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      outillage:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "detector"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
