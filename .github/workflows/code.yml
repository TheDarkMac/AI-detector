# CI du code — voir docs/decisions/ADR-0051-integration-continue-du-code.md
name: code

on:
  pull_request:
    branches: [detector]
  push:
    branches: [detector]
  schedule:
    # Chaque lundi : nouvelles failles connues (ADR-0052), changements des images des runners
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Une PR n'a besoin que du résultat de son dernier commit : les lancements précédents sont annulés.
# Ailleurs (push sur detector, lundi, à la demande), chaque lancement a son propre groupe et va au bout (ERR-0006).
concurrency:
  group: code-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"

defaults:
  run:
    shell: bash

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : le registre du catalogue est comparé à detector (ADR-0085).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verrou à jour (ADR-0037)
        run: uv lock --check
      - name: Installation depuis le verrou, sans résolution
        run: uv sync --locked
      - name: Formatage (Ruff)
        run: uv run --locked ruff format --check .
      - name: Analyse statique (Ruff)
        run: uv run --locked ruff check .
      - name: Types (mypy strict)
        run: uv run --locked mypy
      - name: Versions publiées du catalogue inchangées (ADR-0085)
        env:
          # PR : sa branche cible ; push sur detector : le commit précédent ; sinon detector.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && 'HEAD^1' || 'origin/detector' }}
        run: python3 -I .github/scripts/catalogue.py base "$BASE"

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Installation depuis le verrou
        run: uv sync --locked
      - name: Espaces de noms permis sans privilège, pour le banc sans réseau (ADR-0100)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests et couverture
        run: |
          uv run --locked coverage run -m pytest --junitxml="$RUNNER_TEMP/junit.xml"
          uv run --locked coverage combine
          uv run --locked coverage report
      - name: Matrice de vérification remplie par ce passage (ADR-0102)
        if: ${{ !cancelled() }}
        run: uv run --locked python -m banc.matrice --resultats "$RUNNER_TEMP/junit.xml" --sortie "$RUNNER_TEMP/matrice.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: matrice-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/matrice.md
          if-no-files-found: error
      - name: Rapports du corpus d'essai, comparés ensuite entre systèmes (T18, ADR-0110)
        run: |
          # Liste fixe, même rang sur chaque système ; toutes les catégories levées, nom compris.
          uv run --locked vk --rapport "$RUNNER_TEMP/rapports" \
            --reveler metadonnee_nominative --reveler numero_de_serie --reveler gps \
            --reveler nom_de_fichier --reveler empreinte \
            banc/essai/authentiques/note.txt banc/essai/authentiques/photo.jpg \
            banc/essai/authentiques/facture.pdf banc/essai/authentiques/schema.png \
            banc/essai/generes/image.png banc/essai/transformes/photo-messagerie.jpg \
            banc/essai/retouches/facture-modifiee.pdf banc/essai/malformes/tronque.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rapports/*.json
          if-no-files-found: error

  # Mêmes résultats sur Linux, macOS et Windows, et sous chaque version de Python (NF-06).
  reproductibilite:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Installation depuis le verrou
        run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rapports-*
          path: ${{ runner.temp }}/rapports
      - name: Rapports identiques, à la date près, d'un système et d'un Python à l'autre (T18)
        run: |
          cd "$RUNNER_TEMP/rapports"
          reference=rapports-ubuntu-latest-3.13
          if [ "$(ls -d rapports-* | wc -l)" -ne 9 ]; then
            echo "::error::Neuf jeux de rapports attendus (3 systèmes, 3 versions de Python)"
            exit 1
          fi
          for jeu in rapports-*; do
            diff <(ls "$reference") <(ls "$jeu")
            for rapport in "$reference"/*.json; do
              echo "== $jeu/${rapport##*/}"
              # Code 0 : aucun écart de résultat ; seules l'isolation, la version de
              # l'interpréteur et celle d'expat peuvent différer (ADR-0110, ADR-0120).
              uv run --locked --project "$GITHUB_WORKSPACE" vk --comparer "$rapport" "$jeu/${rapport##*/}"
            done
          done

  audit-dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Failles connues de toutes les dépendances verrouillées (ADR-0052)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/exigences.txt"
          uv run --locked pip-audit --requirement "$RUNNER_TEMP/exigences.txt" --disable-pip --strict --progress-spinner off

  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Construction reproductible (deux constructions identiques)
        run: |
          uv build --build-constraint contraintes-construction.txt --require-hashes --out-dir "$RUNNER_TEMP/a"
          uv build --build-constraint contraintes-construction.txt --require-hashes --out-dir "$RUNNER_TEMP/b"
          (cd "$RUNNER_TEMP/a" && sha256sum -- *) > "$RUNNER_TEMP/a.sha256"
          (cd "$RUNNER_TEMP/b" && sha256sum -- *) > "$RUNNER_TEMP/b.sha256"
          diff "$RUNNER_TEMP/a.sha256" "$RUNNER_TEMP/b.sha256"
          cat "$RUNNER_TEMP/a.sha256"
      - name: Le paquet source ne contient ni docs/ ni .github/
        run: |
          if tar tzf "$RUNNER_TEMP"/a/*.tar.gz | grep -E '/(docs|\.github)/'; then
            echo "::error::Fichiers de dépôt dans le paquet source"
            exit 1
          fi
      - name: Fichier LICENSE et licence déclarée dans les deux paquets (ADR-0067)
        run: |
          tar tzf "$RUNNER_TEMP"/a/*.tar.gz | grep -E '^[^/]+/LICENSE$'
          python3 -I -c '
          import sys, tarfile, zipfile
          wheel, = [f for f in sys.argv[1:] if f.endswith(".whl")]
          sdist, = [f for f in sys.argv[1:] if f.endswith(".tar.gz")]
          with zipfile.ZipFile(wheel) as z:
              noms = z.namelist()
              if not any(n.endswith(".dist-info/licenses/LICENSE") for n in noms):
                  sys.exit("LICENSE absent du wheel")
              meta = z.read(next(n for n in noms if n.endswith(".dist-info/METADATA"))).decode()
          with tarfile.open(sdist) as t:
              pkg = t.extractfile(next(m for m in t.getmembers() if m.name.endswith("/PKG-INFO"))).read().decode()
          for nom, texte in (("wheel", meta), ("sdist", pkg)):
              if "License-Expression: Apache-2.0" not in texte.splitlines():
                  sys.exit(f"License-Expression absente des métadonnées du {nom}")
          ' "$RUNNER_TEMP"/a/*
      - name: Installation du wheel dans un environnement neuf
        run: |
          uv venv "$RUNNER_TEMP/essai"
          VIRTUAL_ENV="$RUNNER_TEMP/essai" uv pip install "$RUNNER_TEMP"/a/*.whl
          "$RUNNER_TEMP/essai/bin/voight-kampff" --version
          "$RUNNER_TEMP/essai/bin/vk" --version
      - name: Schémas livrés dans le wheel et chargeables (T11)
        run: |
          "$RUNNER_TEMP/essai/bin/python" -I -c "from voight_kampff import schemas; [schemas.valideur(n) for n in schemas.NOMS]"
      - name: Processus de travail lancé depuis le wheel (T12)
        run: |
          printf 'essai' > "$RUNNER_TEMP/essai.bin"
          "$RUNNER_TEMP/essai/bin/python" -I -c '
          import hashlib, os, sys
          from voight_kampff._orchestration import manifestes, travail
          resultat = travail.executer(os.open(sys.argv[1], os.O_RDONLY), manifestes.decouvrir())
          if resultat.interrompue or resultat.empreinte != hashlib.sha256(b"essai").hexdigest():
              sys.exit("processus de travail en échec depuis le wheel")
          ' "$RUNNER_TEMP/essai.bin"
          "$RUNNER_TEMP/essai/bin/vk" --modules
      - name: Catalogue livré dans le wheel, inscrit au registre (T15)
        run: |
          python3 -I .github/scripts/catalogue.py paquet "$RUNNER_TEMP"/a/*.whl | tee "$RUNNER_TEMP/catalogue.txt"
          empreinte="$(sed -n 's/^Empreinte SHA-256 : //p' "$RUNNER_TEMP/catalogue.txt")"
          "$RUNNER_TEMP/essai/bin/vk" --regles | tee "$RUNNER_TEMP/regles.txt"
          grep -q "empreinte ${empreinte}\$" "$RUNNER_TEMP/regles.txt"
      - name: Commande d'analyse depuis le wheel (T13)
        run: |
          printf '%%PDF-1.7\n%%%%EOF\n' > "$RUNNER_TEMP/essai.pdf"
          "$RUNNER_TEMP/essai/bin/vk" "$RUNNER_TEMP/essai.pdf" | tee "$RUNNER_TEMP/analyse.txt"
          grep -qx '\[1/1\] format réel : pdf' "$RUNNER_TEMP/analyse.txt"
          : > "$RUNNER_TEMP/vide.pdf"
          if "$RUNNER_TEMP/essai/bin/vk" "$RUNNER_TEMP/vide.pdf"; then
            echo "::error::Un fichier vide doit être refusé (code 1)"
            exit 1
          fi
      - name: Rapports HTML et JSON depuis le wheel (T16)
        run: |
          "$RUNNER_TEMP/essai/bin/vk" --rapport "$RUNNER_TEMP/rapports" "$RUNNER_TEMP/essai.pdf"
          "$RUNNER_TEMP/essai/bin/python" -I -c '
          import json, sys
          from pathlib import Path
          from voight_kampff.rapport import export
          dossier = Path(sys.argv[1])
          document = json.loads((dossier / "1.json").read_text(encoding="utf-8"))
          export.valider(document)
          if {"nom", "empreinte"} & set(document["identification"]):
              sys.exit("nom ou empreinte non masqués dans le rapport JSON")
          html = (dossier / "1.html").read_text(encoding="utf-8")
          if "Content-Security-Policy" not in html or "<script" in html:
              sys.exit("rapport HTML sans politique de sécurité, ou avec un script")
          ' "$RUNNER_TEMP/rapports"

      - name: Banc d'évaluation sans réseau depuis le wheel (T17)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Avec le réseau, le banc refuse de démarrer (code 2) et n'écrit rien.
          code=0
          "$RUNNER_TEMP/essai/bin/python" -m banc banc/essai/corpus.toml --sortie "$RUNNER_TEMP/banc-refus" || code=$?
          if [ "$code" -ne 2 ] || [ -e "$RUNNER_TEMP/banc-refus" ]; then
            echo "::error::Le banc doit refuser de démarrer avec le réseau (code 2, obtenu $code)"
            exit 1
          fi
          # Dans un espace de noms réseau vide : seul écart attendu, la cible par fichier, que
          # quatre authentiques ne suffisent pas à établir (code 1).
          code=0
          unshare -rn "$RUNNER_TEMP/essai/bin/python" -m banc banc/essai/corpus.toml --sortie "$RUNNER_TEMP/banc" || code=$?
          cat "$RUNNER_TEMP/banc/evaluation.md"
          "$RUNNER_TEMP/essai/bin/python" -I -c '
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          if int(sys.argv[2]) != 1 or doc["reseau"] != {"interfaces": ["lo"], "tentatives": 0}:
              sys.exit("banc : code ou état du réseau inattendus")
          if [e.split(" :")[0] for e in doc["ecarts"]] != ["taux par fichier"]:
              sys.exit("banc : écarts inattendus")
          if doc["fichiers"]["arrets_brutaux"] or doc["publiable"]:
              sys.exit("banc : arrêt brutal, ou corpus d'\''essai déclaré publiable")
          if doc["fichiers"]["non_reproduits"]:
              sys.exit("banc : deux analyses différentes d'\''un même fichier (T18)")
          ' "$RUNNER_TEMP/banc/evaluation.json" "$code"
      - name: Comparaison de deux rapports depuis le wheel (T18)
        run: |
          for dossier in deux-a deux-b; do
            "$RUNNER_TEMP/essai/bin/vk" --rapport "$RUNNER_TEMP/$dossier" --reveler empreinte "$RUNNER_TEMP/essai.pdf"
          done
          "$RUNNER_TEMP/essai/bin/vk" --comparer "$RUNNER_TEMP/deux-a/1.json" "$RUNNER_TEMP/deux-b/1.json" | tee "$RUNNER_TEMP/comparaison.txt"
          grep -q '^Conditions de la garantie de reproductibilité réunies' "$RUNNER_TEMP/comparaison.txt"
          # Un autre fichier : résultats différents, hors garantie (code 1).
          "$RUNNER_TEMP/essai/bin/vk" --rapport "$RUNNER_TEMP/deux-c" --reveler empreinte banc/essai/authentiques/facture.pdf
          code=0
          "$RUNNER_TEMP/essai/bin/vk" --comparer "$RUNNER_TEMP/deux-a/1.json" "$RUNNER_TEMP/deux-c/1.json" || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::Deux fichiers différents : code 1 attendu, obtenu $code"
            exit 1
          fi

  # Seule vérification à rendre obligatoire sur detector : elle résume toutes les autres.
  code-ok:
    if: always()
    needs: [qualite, tests, reproductibilite, audit-dependances, paquet]
    runs-on: ubuntu-latest
    steps:
      - name: Toutes les vérifications du code ont réussi
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::Au moins une vérification du code a échoué ou n'a pas tourné"
            exit 1
          fi
