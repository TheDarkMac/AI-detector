# Matrice de vérification : exigence → méthode de vérification → résultat (ADR-0024, ADR-0102).
#
# Une table [[exigence]] par exigence du cahier (F, NF), exigence de sécurité (ES, modèle de
# menace §8) et principe directeur (P, numérotés ci-dessous, A-11). Les tests qui vérifient une
# exigence la citent par le marqueur pytest « exigence » ; ce fichier porte l'état, les tâches,
# les autres méthodes et leur résultat. `python -m banc.matrice` en tire matrice.md et vérifie
# la cohérence des deux (procédure : README.md de ce dossier).
#
# etat : realisee, partielle, a_venir, hors_v1 ; methodes : test, inspection, analyse,
# demonstration. Une méthode autre que « test » est justifiée (ADR-0024) ; pour une exigence
# réalisée, elle porte sa preuve (document) et son résultat consigné.

format = 1

# Principes directeurs du §2 du cahier, numérotés pour la matrice (A-11, ADR-0106).

[[principe]]
id = "P-01"
nom = "Aucune IA embarquée"
texte = "Ni réseau de neurones ni modèle entraîné ; des règles et des seuils écrits, documentés et versionnés."

[[principe]]
id = "P-02"
nom = "Explicabilité"
texte = "Chaque constat cite la règle qui l'a produit et la donnée observée."

[[principe]]
id = "P-03"
nom = "Preuve ≠ indice"
texte = "Ce qui est vérifié n'est jamais mélangé avec ce qui est seulement suggéré."

[[principe]]
id = "P-04"
nom = "Absence ≠ authenticité"
texte = "Ne rien trouver n'est jamais présenté comme une garantie."

[[principe]]
id = "P-05"
nom = "Reproductibilité"
texte = "Même fichier et même version des règles donnent les mêmes constats."

[[principe]]
id = "P-06"
nom = "Modularité"
texte = "Chaque technique s'ajoute, se retire ou se désactive sans toucher aux autres."

