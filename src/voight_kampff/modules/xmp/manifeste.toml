# Module xmp : métadonnées XMP d'une image, d'un PDF, d'un WAV, d'un M4A, d'un MP4 ou d'un MOV (ADR-0114, ADR-0127, ADR-0134). Validé par schemas/manifeste.schema.json (ADR-0064).

identifiant = "xmp"
version = "0.3.0"
formats = ["jpeg", "png", "webp", "heic", "pdf", "wav", "m4a", "mp4", "mov"]
exigences = ["F-10", "ES-05", "ES-13"]
regles = []
fiche = "metadonnees-xmp"
# Extraction seule : aucun constat, donc aucune direction autre que « rien de particulier ».
directions = ["rien_de_particulier"]
requiert = []
bibliotheques = ["expat"]
