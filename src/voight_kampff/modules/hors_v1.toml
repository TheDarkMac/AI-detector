# Techniques hors de cette version de l'outil (ADR-0012, ADR-0059, ADR-0087).
#
# Chacune figure à la couverture de chaque partie d'un de ses formats, sans version, non menée
# pour la raison « hors_v1 » : le rapport dit ce que l'outil ne cherche pas (F-25, F-82).
# Validé par schemas/hors_v1.schema.json. Ce fichier appartient à l'outil, pas au catalogue :
# un catalogue fourni par l'utilisateur ne le change pas.
#
# Ne figurent pas ici : les techniques de la V1 pas encore livrées dans une version de
# développement, et la comparaison d'exemplaires (T93), qui porte sur plusieurs fichiers.

