# Textes du rapport destinés à l'utilisateur, en français (ADR-0020, ADR-0098).
#
# Séparés du code pour être relus et traduits. Les phrases des constats ne sont pas ici : elles
# sont dans les règles du catalogue (ADR-0091). Un {nom} est remplacé par le code ; aucun texte
# ne présente un indice comme une certitude (NF-14).

titre = "Rapport d'analyse"
evitement = "Aller au résumé"

avertissement = [
    "Ce rapport ne délivre aucun verdict : l'outil ne sait pas dire avec certitude si un fichier a été généré ou retouché par IA.",
    "Une preuve n'établit que ce que son énoncé dit, rien de plus. Un indice est compatible avec une hypothèse sans l'établir : il peut apparaître sur un fichier authentique.",
    "L'absence de constat ne prouve pas l'authenticité : elle ne vaut que pour les techniques appliquées et les marquages recherchés, listés à la rubrique Couverture.",
]

masque = "[masqué : {categorie}]"
texte_vide = "(texte vide)"
liste_vide = "(liste vide)"
aucun = "aucun"
aucune = "aucune"
oui = "oui"
non = "non"
