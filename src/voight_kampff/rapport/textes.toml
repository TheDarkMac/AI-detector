# Termes du rapport, repris du glossaire du projet (docs/glossaire.md) en langage courant (NF-11).
[glossaire]
preuve = ["Preuve", "Fait établi par une vérification cryptographique ou déterministe, accompagné de l'énoncé exact de ce qu'il établit, et seulement cela."]
indice = ["Indice", "Constat compatible avec une hypothèse, sans l'établir. Il porte un niveau (faible, modéré, fort) fixé par sa règle d'après son taux de faux positifs mesuré."]
information_neutre = ["Information neutre", "Constat sans valeur probante, par exemple l'absence de métadonnées : il ne pointe vers aucune hypothèse."]
direction = ["Direction", "Hypothèse vers laquelle pointe un constat : origine IA, retouche, transformation (recompression, capture d'écran, messagerie), authenticité, ou rien de particulier."]
niveau = ["Niveau", "Faible, modéré ou fort : propriété fixe de la règle d'un indice. Une règle dont le taux de faux positifs n'est pas mesuré est au niveau faible."]
fondement = ["Fondement", "Ce sur quoi repose un constat : vérification cryptographique, vérification déterministe, déclaration contenue dans le fichier, ou mesure. Une déclaration se réécrit librement."]
regle = ["Règle", "Élément public et versionné du catalogue qui tire un constat d'observations ; elle dit ses limites connues."]
observation = ["Observation", "Donnée relevée dans le fichier (valeur d'un champ, mesure), sans interprétation."]
couverture = ["Couverture", "Techniques appliquées ou non au fichier et marquages recherchés : un résultat négatif ne vaut que pour eux."]
non_menee = ["Analyse non menée", "Analyse qui aurait pu s'appliquer au fichier et ne l'a pas été, avec sa raison."]
interrompue = ["Analyse interrompue", "Analyse dont une partie n'a pas abouti pour une raison qui dépend de la machine (délai, mémoire, arrêt) : ses résultats ne sont pas garantis reproductibles."]
format_reel = ["Format réel", "Format identifié par le contenu du fichier, non par son extension."]
partie = ["Partie", "Format reconnu dans le fichier et plage d'octets qu'il occupe. Un fichier polyglotte en a plusieurs."]
empreinte = ["Empreinte", "Résumé cryptographique (SHA-256) du fichier entier : qui détient le même fichier obtient la même empreinte. Elle peut donc désigner une source, et elle est masquée par défaut."]
donnee_identifiante = ["Donnée identifiante", "Donnée qui peut désigner une source : métadonnée nominative, numéro de série, coordonnées GPS, nom du fichier, empreinte. Masquée par défaut."]
isolation = ["Isolation", "Restrictions imposées au processus qui lit le fichier : sans réseau, sans écriture, sans lancement de programmes. Réduite, elle protège moins le poste."]
