# Règles du module id3 (T22) : nom d'un générateur dans un champ logiciel (F-12, ADR-0144).

[[regle]]
identifiant = "R-ID3-001"
version = "1"
module = "id3"
titre = "Générateur nommé par la trame ID3 du logiciel d'encodage"
description = "La trame ID3v2 TSSE (logiciel et réglages d'encodage) nomme un logiciel de génération par IA de la liste du catalogue (ADR-0144) : Midjourney, DALL·E, Stable Diffusion, Adobe Firefly, ComfyUI, InvokeAI, NovelAI, AUTOMATIC1111, Fooocus, Leonardo.Ai, Ideogram, Craiyon, DreamStudio, ChatGPT, Suno, Udio, ElevenLabs."
gabarit = "id3.logiciel-generateur"
phrase = { fr = "La trame ID3 TSSE, qui nomme le logiciel d'encodage, vaut « {logiciel} » : on y lit le nom d'un logiciel de génération par IA." }
categorie = "indice"
direction = "origine_ia"
fondement = "declaration"
niveau = "faible"
limites = [
  "Déclaration du fichier : quiconque peut écrire ou effacer cette trame ; son absence ne dit rien (F-14).",
  "Seuls les noms de la liste sont reconnus, entiers et sans faute ; un générateur qui n'écrit pas son nom, ou l'écrit autrement, n'est pas vu.",
  "Le constat dit ce que le champ nomme, pas ce que le logiciel a fait : un générateur peut aussi avoir servi à retoucher ou à convertir le fichier.",
]
application = "moteur"

[[regle.condition]]
observation = "id3.TSSE"
motif = '(?i)\b(?:midjourney|dall[-·‧ ]e|stable[- ]?diffusion|adobe firefly|comfyui|invoke[- ]?ai|novelai|automatic1111|fooocus|leonardo\.ai|ideogram|craiyon|dreamstudio|chatgpt|suno|udio|elevenlabs)\b'
parametre = "logiciel"
