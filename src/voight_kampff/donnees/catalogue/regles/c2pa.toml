# Règles du module c2pa (T30) : état de la vérification d'un manifeste C2PA (F-21, F-22) et
# déclarations qu'il porte (F-23), appliquées par le code du module (ADR-0084, ADR-0090).
#
# La vérification est celle de c2pa-rs, par c2pa-python (ADR-0164), contre la liste de confiance
# employée, inscrite à la rubrique Versions (ADR-0165, ADR-0171). Une preuve ne dit que ce que la
# vérification établit (ADR-0021) : un certificat reconnu a signé le manifeste, et le contenu n'a
# pas changé depuis. Les codes IPTC sont ceux du XMP, avec les mêmes directions (ADR-0143) ; la
# capture n'a de constat que sous un signataire reconnu (ADR-0168). États et règles : ADR-0169 et
# ADR-0170 ; manifeste invalide : ADR-0167 ; requêtes en ligne : ADR-0166.

[[regle]]
identifiant = "R-C2PA-001"
version = "1"
module = "c2pa"
titre = "Création par IA générative déclarée, signataire reconnu (C2PA)"
description = "Le manifeste C2PA actif est valide, signé par un certificat dont la chaîne mène à une ancre de la liste de confiance employée, et l'une de ses actions déclare la source numérique trainedAlgorithmicMedia de l'IPTC : un contenu créé par un modèle d'IA générative."
gabarit = "c2pa.generation-ia-signataire-reconnu"
phrase = { fr = "Le manifeste C2PA déclare « {source} » : selon le vocabulaire de l'IPTC, un contenu créé par une IA générative. Il est signé par un certificat reconnu par la liste de confiance employée (rubrique Versions), et le contenu n'a pas changé depuis la signature." }
categorie = "preuve"
direction = "origine_ia"
fondement = "verification_cryptographique"
parametres = ["source"]
limites = [
  "La vérification établit qui a signé et que le contenu n'a pas changé depuis ; elle n'établit pas que la déclaration est vraie (ADR-0021).",
  "Reconnu par la liste employée, à sa version : une autre liste, plus ancienne ou plus récente, peut donner un autre résultat.",
  "La révocation du certificat n'est pas vérifiée en ligne (ADR-0166) : seule une réponse OCSP jointe au manifeste est lue.",
  "Seules les actions du manifeste actif fondent la règle ; celles des ingrédients sont restituées sans constat.",
]
application = "module"

