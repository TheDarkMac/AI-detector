titre = "Capture déclarée, signataire reconnu (C2PA)"
description = "Le manifeste C2PA actif est valide, signé par un certificat reconnu par la liste de confiance employée, et l'une de ses actions déclare la source numérique digitalCapture ou computationalCapture de l'IPTC : une capture par un appareil (ADR-0168)."
gabarit = "c2pa.capture-signataire-reconnu"
phrase = { fr = "Le manifeste C2PA déclare « {source} » : selon le vocabulaire de l'IPTC, une capture par un appareil. Il est signé par un certificat reconnu par la liste de confiance employée (rubrique Versions), et le contenu n'a pas changé depuis la signature." }
categorie = "preuve"
direction = "authenticite"
