[[regle]]
identifiant = "R-C2PA-006"
version = "1"
module = "c2pa"
titre = "Contenu ou manifeste changé depuis la signature (C2PA)"
description = "La vérification du manifeste C2PA actif échoue sur une empreinte : celle du contenu signé (assertion.dataHash, bmffHash, boxesHash ou collectionHash), celle d'une assertion (assertion.hashedURI) ou la signature de la revendication (claimSignature.mismatch). Indice faible, non évalué, vers la transformation (ADR-0167)."
gabarit = "c2pa.contenu-change"
phrase = { fr = "Le contenu ou le manifeste C2PA ne correspond plus à ce qui a été signé (codes « {codes} ») : l'un d'eux a changé depuis la signature." }
categorie = "indice"
direction = "transformation"
fondement = "verification_cryptographique"
niveau = "faible"
parametres = ["codes"]
limites = [
  "L'écart d'empreinte est établi, sa cause ne l'est pas : retouche, conversion par un outil qui garde le manifeste sans le mettre à jour, défaut d'un logiciel, ou manifeste recopié sur un autre contenu.",
  "Le changement n'est ni décrit ni localisé.",
]
application = "module"

