limites = [
  "La vérification établit qui a signé et que le contenu n'a pas changé depuis ; elle n'établit pas que la déclaration est vraie (ADR-0021) : un appareil compromis, ou la photographie d'un écran, donnent aussi une capture signée.",
  "Reconnu par la liste employée, à sa version : une autre liste, plus ancienne ou plus récente, peut donner un autre résultat.",
  "La révocation du certificat n'est pas vérifiée en ligne (ADR-0166) : seule une réponse OCSP jointe au manifeste est lue.",
  "Une capture déclarée sous un certificat non reconnu n'a pas de constat : elle se forge comme toute déclaration (ADR-0143).",
]
application = "module"

