gabarit = "c2pa.retouche-ia-signataire-reconnu"
phrase = { fr = "Le manifeste C2PA déclare « {source} » : selon le vocabulaire de l'IPTC, un contenu retouché ou monté avec une IA générative. Il est signé par un certificat reconnu par la liste de confiance employée (rubrique Versions), et le contenu n'a pas changé depuis la signature." }
categorie = "preuve"
direction = "retouche"
fondement = "verification_cryptographique"
parametres = ["source"]
limites = [
  "La vérification établit qui a signé et que le contenu n'a pas changé depuis ; elle n'établit pas que la déclaration est vraie (ADR-0021).",
  "La déclaration ne dit ni quelle part du contenu est générée, ni où elle se trouve.",
  "Reconnu par la liste employée, à sa version : une autre liste, plus ancienne ou plus récente, peut donner un autre résultat.",
  "La révocation du certificat n'est pas vérifiée en ligne (ADR-0166) : seule une réponse OCSP jointe au manifeste est lue.",
]
application = "module"

