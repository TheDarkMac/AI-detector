[[regle]]
identifiant = "R-EXIF-006"
version = "1"
module = "exif"
titre = "Prise de vue postérieure à la modification (DateTimeOriginal, DateTime)"
description = "La date de prise de vue EXIF (DateTimeOriginal) est postérieure à la date de modification EXIF (DateTime), pour tous les instants que peuvent désigner les deux dates, lues selon l'écriture EXIF AAAA:MM:JJ HH:MM:SS : l'ordre que fixe leur définition est renversé, l'une des deux au moins est inexacte (F-13, ADR-0150)."
gabarit = "exif.prise-de-vue-apres-modification"
phrase = { fr = "La date de prise de vue EXIF (DateTimeOriginal), « {prise} », est postérieure à la date de modification EXIF (DateTime), « {modification} », quel que soit le fuseau horaire : l'une des deux au moins est inexacte." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : une horloge mal réglée, un logiciel qui recopie ou réécrit une date, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Une date sans fuseau est lue dans tous les fuseaux, de UTC-12 à UTC+14 : un écart de moins de 26 heures entre deux dates sans fuseau n'est pas relevé (ADR-0148).",
  "Les étiquettes OffsetTime, OffsetTimeOriginal et OffsetTimeDigitized ne sont pas lues : chaque date EXIF est prise sans fuseau.",
  "Une valeur qui ne suit pas l'écriture de la date, ou qui dit une date inconnue, n'est pas comparée (ADR-0148).",
]
application = "moteur"

[[regle.condition]]
observation = "exif.exif.DateTimeOriginal"
lecture = "date-exif"
parametre = "prise"
comparer = { observation = "exif.ifd0.DateTime", operateur = ">", parametre = "modification" }

