[[regle]]
identifiant = "R-EXIF-009"
version = "1"
module = "exif"
titre = "Appareil déclaré et générateur nommé (Make, Software)"
description = "L'étiquette EXIF Make déclare l'appareil qui a pris l'image, et l'étiquette Software nomme un logiciel de génération par IA de la liste du catalogue (ADR-0144) : logiciel incompatible avec l'appareil déclaré (F-13, ADR-0150)."
gabarit = "exif.appareil-et-generateur"
phrase = { fr = "L'étiquette EXIF Make déclare un appareil (« {appareil} ») et l'étiquette Software nomme un logiciel de génération par IA (« {logiciel} ») : ces deux déclarations se contredisent, ou décrivent deux étapes, une prise de vue puis un passage par ce logiciel." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : un logiciel qui garde l'appareil d'une photo qu'il transforme, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Seuls les noms de la liste des générateurs sont reconnus (ADR-0144) ; le nom du générateur fait aussi l'indice d'une autre règle du module.",
]
application = "moteur"

[[regle.condition]]
observation = "exif.ifd0.Make"
presente = true
parametre = "appareil"

[[regle.condition]]
observation = "exif.ifd0.Software"
motif = '(?i)\b(?:midjourney|dall[-·‧ ]e|stable[- ]?diffusion|adobe firefly|comfyui|invoke[- ]?ai|novelai|automatic1111|fooocus|leonardo\.ai|ideogram|craiyon|dreamstudio|chatgpt|suno|udio|elevenlabs)\b'
parametre = "logiciel"

[[regle]]
identifiant = "R-EXIF-010"
version = "1"
module = "exif"
titre = "Appareil déclaré et dimensions carrées d'un générateur"
description = "L'étiquette Make déclare un appareil, et PixelXDimension et PixelYDimension des dimensions qui sont des tailles de sortie documentées de l'API d'images d'OpenAI (256 × 256, 512 × 512, 1 024 × 1 024, référence de l'API lue le 2026-11-13) : dimensions atypiques pour l'appareil déclaré (F-13, A-32, ADR-0150)."
gabarit = "exif.appareil-et-dimensions-carrees"
phrase = { fr = "L'EXIF déclare un appareil (« {appareil} ») et des dimensions de {largeur} × {hauteur} pixels, une taille de sortie de générateurs d'images : un appareil photo ne les écrit pas d'ordinaire, mais un logiciel qui recadre ou redimensionne une photo peut les écrire en gardant l'appareil." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : un recadrage ou un redimensionnement qui garde l'appareil, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Les dimensions lues sont celles que déclare l'EXIF, pas celles de l'image : un logiciel qui redimensionne sans réécrire l'EXIF les rend fausses.",
  "Seules les tailles fixes de l'API d'OpenAI sont reconnues ; un générateur aux dimensions libres, ou une autre taille, n'est pas vu.",
]
application = "moteur"

[[regle.condition]]
observation = "exif.ifd0.Make"
presente = true
parametre = "appareil"

[[regle.condition]]
observation = "exif.exif.PixelXDimension"
parmi = [256, 512, 1024]
parametre = "largeur"

[[regle.condition]]
observation = "exif.exif.PixelXDimension"
comparer = { observation = "exif.exif.PixelYDimension", operateur = "=", parametre = "hauteur" }

