[[regle]]
identifiant = "R-EXIF-013"
version = "1"
module = "exif"
titre = "Aucune métadonnée EXIF"
description = "Le module exif n'a trouvé aucune métadonnée EXIF (blocs EXIF du JPEG, du PNG, du WebP ou du HEIC) : l'observation exif.present vaut faux. Information neutre (F-14, A-34, ADR-0151) : elle ne compte ni pour ni contre une origine IA."
