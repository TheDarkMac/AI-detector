[[regle]]
identifiant = "R-XMP-009"
version = "1"
module = "xmp"
titre = "Création postérieure à la modification (xmp:CreateDate, xmp:ModifyDate)"
description = "La date de création XMP (xmp:CreateDate) est postérieure à la date de modification XMP (xmp:ModifyDate), pour tous les instants que peuvent désigner les deux dates, lues selon l'écriture ISO 8601 (AAAA-MM-JJThh:mm:ss et fuseau) : l'ordre que fixe leur définition est renversé, l'une des deux au moins est inexacte (F-13, ADR-0150)."
gabarit = "xmp.creation-apres-modification"
phrase = { fr = "La date de création XMP (xmp:CreateDate), « {creation} », est postérieure à la date de modification XMP (xmp:ModifyDate), « {modification} », quel que soit le fuseau horaire : l'une des deux au moins est inexacte." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : une horloge mal réglée, un logiciel qui recopie ou réécrit une date, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Une date sans fuseau est lue dans tous les fuseaux, de UTC-12 à UTC+14 : un écart de moins de 26 heures entre deux dates sans fuseau n'est pas relevé (ADR-0148).",
  "Une valeur qui ne suit pas l'écriture de la date, ou qui dit une date inconnue, n'est pas comparée (ADR-0148).",
]
application = "moteur"

[[regle.condition]]
observation = "xmp.xmp:CreateDate"
lecture = "date-iso8601"
parametre = "creation"
comparer = { observation = "xmp.xmp:ModifyDate", operateur = ">", parametre = "modification" }

