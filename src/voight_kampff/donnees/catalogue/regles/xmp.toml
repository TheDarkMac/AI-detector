[[regle]]
identifiant = "R-XMP-011"
version = "1"
module = "xmp"
titre = "Appareil déclaré et générateur nommé (tiff:Make, xmp:CreatorTool)"
description = "La propriété XMP tiff:Make déclare l'appareil qui a pris l'image, et xmp:CreatorTool nomme un logiciel de génération par IA de la liste du catalogue (ADR-0144) : logiciel incompatible avec l'appareil déclaré (F-13, ADR-0150)."
gabarit = "xmp.appareil-et-generateur"
phrase = { fr = "La propriété XMP tiff:Make déclare un appareil (« {appareil} ») et xmp:CreatorTool nomme un logiciel de génération par IA (« {logiciel} ») : ces deux déclarations se contredisent, ou décrivent deux étapes, une prise de vue puis un passage par ce logiciel." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : un logiciel qui garde l'appareil d'une photo qu'il transforme, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Seuls les noms de la liste des générateurs sont reconnus (ADR-0144) ; le nom du générateur fait aussi l'indice d'une autre règle du module.",
]
application = "moteur"

[[regle.condition]]
observation = "xmp.tiff:Make"
presente = true
parametre = "appareil"

[[regle.condition]]
observation = "xmp.xmp:CreatorTool"
motif = '(?i)\b(?:midjourney|dall[-·‧ ]e|stable[- ]?diffusion|adobe firefly|comfyui|invoke[- ]?ai|novelai|automatic1111|fooocus|leonardo\.ai|ideogram|craiyon|dreamstudio|chatgpt|suno|udio|elevenlabs)\b'
parametre = "logiciel"

[[regle]]
identifiant = "R-XMP-012"
version = "1"
module = "xmp"
titre = "Aucune métadonnée XMP"
description = "Le module xmp n'a trouvé aucune métadonnée XMP (paquets XMP des emplacements de la fiche) : l'observation xmp.present vaut faux. Information neutre (F-14, A-34, ADR-0151) : elle ne compte ni pour ni contre une origine IA."
gabarit = "xmp.absence"
phrase = { fr = "Le fichier ne porte aucune métadonnée XMP. Cette absence est fréquente (messageries, réseaux sociaux, conversions) et ne dit rien de son origine." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "verification_deterministe"
limites = [
  "Absence neutre : beaucoup de logiciels, messageries et plateformes retirent ces métadonnées, et beaucoup de générateurs n'en écrivent pas ; elle n'est ni un indice d'IA ni une garantie d'authenticité (F-14, P-04).",
  "Seuls les emplacements de la fiche du module sont lus : des métadonnées logées ailleurs dans le fichier ne sont pas vues.",
]
application = "moteur"

[[regle.condition]]
observation = "xmp.present"
egal = false

# Règle de T24 : indice de transfert, capture d'écran déclarée (F-06, ADR-0153, ADR-0155).

[[regle]]
identifiant = "R-XMP-013"
version = "1"
module = "xmp"
titre = "Capture d'écran déclarée par le commentaire XMP (exif:UserComment)"
description = "La propriété XMP exif:UserComment vaut Screenshot, la valeur que macOS et iOS écrivent dans leurs captures d'écran d'après témoignages d'utilisateurs sur la communauté d'Apple (discussions.apple.com, fil 255854599, lu le 2026-11-13), pas une documentation d'Apple (F-06, ADR-0153)."
gabarit = "xmp.capture-d-ecran"
phrase = { fr = "La propriété XMP exif:UserComment vaut « Screenshot », la valeur que macOS et iOS écrivent dans leurs captures d'écran : le fichier se déclare capture d'écran." }
categorie = "indice"
direction = "transformation"
fondement = "declaration"
niveau = "faible"
limites = [
  "Déclaration du fichier : quiconque peut écrire, recopier ou effacer cette propriété ; son absence ne dit rien (F-14).",
  "Source : témoignages d'utilisateurs sur la communauté d'Apple (discussions.apple.com, fil 255854599, lu le 2026-11-13), pas une documentation d'Apple ; d'autres versions de macOS et d'iOS peuvent écrire autre chose, ou rien, et une capture convertie ou transmise perd souvent cette valeur.",
  "Seule la valeur exacte « Screenshot » est reconnue ; les captures d'autres systèmes et d'autres outils ne sont pas vues.",
  "Une capture d'écran reproduit ce qu'affichait l'écran : elle ne dit rien du fichier affiché, qui peut être généré, retouché ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "xmp.exif:UserComment"
egal = "Screenshot"
