# Règles du module doublejpeg (T41) : double compression JPEG (F-31, ADR-0185 à ADR-0190).
# Méthode : J. Lukáš, J. Fridrich, « Estimation of Primary Quantization Matrix in Double
# Compressed JPEG Images », DFRWS 2003, §4.1 « Compatibility Test » (lu le 2026-11-15) ; fiche
# double-compression-jpeg.

[[regle]]
identifiant = "R-DOUBLEJPEG-001"
version = "1"
module = "doublejpeg"
titre = "Luminance d'un JPEG quantifiée deux fois"
description = "JPEG dont la luminance porte, à au moins 4 des 9 premières fréquences examinées, la trace d'une quantification antérieure : l'histogramme des coefficients du fichier est expliqué au moins quatre fois mieux par deux quantifications successives, à un pas antérieur puis au pas de la table du fichier, que par une seule. L'image avant compression est estimée par la luminance recalculée et recadrée de 4 pixels, ce qui désaccorde la grille des blocs (Lukáš et Fridrich, DFRWS 2003, §4.1). Une image JPEG décompressée puis enregistrée de nouveau en JPEG, sans recadrage ni redimensionnement, porte cette trace (F-31, ADR-0186)."
gabarit = "doublejpeg.double-quantification"
phrase = { fr = "La luminance de l'image JPEG garde, à {traces} des {examinees} fréquences examinées, la trace d'une quantification antérieure à d'autres pas que ceux de ses tables : l'image a été décompressée puis enregistrée de nouveau en JPEG." }
categorie = "indice"
direction = "transformation"
fondement = "mesure"
niveau = "faible"
limites = [
  "Seuils fixés à la main sur des essais, pas mesurés sur un corpus (T100) : des images compressées une seule fois, surtout des images de synthèse ou des aplats, y portent jusqu'à 2 traces sur 9 ; une double compression à qualités proches (par exemple 70 puis 75, ou 80 puis 85) peut rester sous le seuil.",
  "Aucune trace quand les deux compressions emploient les mêmes tables, ni à une fréquence où le pas du fichier est un multiple du pas antérieur ; la trace est la plus nette quand la seconde compression est plus fine que la première.",
  "Un recadrage qui décale la grille des blocs, un redimensionnement ou une rotation entre les deux compressions effacent la trace : la double compression non alignée n'est pas cherchée.",
  "Seule la première composante est examinée, sur une région du haut de l'image (au plus 32 768 blocs, ADR-0189) : la règle ne localise pas une zone retouchée et ne voit pas une trace limitée au reste de l'image.",
  "Le constat dit que l'image a été enregistrée au moins deux fois en JPEG, pas pourquoi : messageries, réseaux sociaux et logiciels d'édition réenregistrent les images ; l'image avant ces étapes peut être générée, retouchée ou authentique.",
]
application = "moteur"

[regle.calibrage]
methode = "manuelle"
procedure = "Rapport de 4 entre les écarts et seuil de 4 traces sur 9 fréquences fixés le 2026-11-15 sur des essais : trois images sans perte du poste et deux images synthétiques, compressées une fois (qualités 75 et 90) ou deux fois (qualités 50 à 95 puis 75 et 90) par cjpeg de libjpeg-turbo 2.1.5, et une photographie JPEG de qualité 80 réenregistrée de 70 à 95. Aucune image compressée une seule fois n'y dépasse 2 traces ; 22 des 24 doubles compressions à qualité croissante des images sans perte en portent 4 ou plus."

[[regle.condition]]
observation = "doublejpeg.traces"
seuil = { operateur = ">=", valeur = 4 }
parametre = "traces"

[[regle.condition]]
observation = "doublejpeg.frequences_examinees"
presente = true
parametre = "examinees"
