# Recompression (F-06), partie de T40 avancée (F-30, ADR-0153) : tables de quantification de
# libjpeg (jcparam.c, annexe K de T.81), reconnues à une qualité de 1 à 100.

[[regle]]
identifiant = "R-IMAGE-004"
version = "1"
module = "image"
titre = "JPEG sans métadonnées encodé aux tables de libjpeg"
description = "JPEG sans aucun bloc de métadonnées lu par le projet (règles d'absence R-EXIF-013, R-XMP-012 et R-IPTC-002, A-34), dont les tables de quantification sont exactement celles qu'écrit la bibliothèque libjpeg de l'IJG à une qualité de 1 à 100 (annexe K de T.81, mise à l'échelle de jcparam.c) : profil d'une image réencodée par un logiciel courant, ce que font les messageries et les réseaux sociaux qui recompressent toujours les images reçues (Giudice et al. 2016, tableau III) (F-06, F-30, ADR-0153)."
gabarit = "image.tables-libjpeg-sans-metadonnees"
phrase = { fr = "L'image JPEG est encodée avec les tables de quantification de la bibliothèque libjpeg à la qualité {qualite} et ne porte aucune métadonnée : c'est le profil d'une image réenregistrée par un logiciel courant, comme le font des messageries et des réseaux sociaux." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "La règle ne mesure pas une double compression (T41) : un fichier encodé une seule fois par un logiciel ou un générateur qui emploie libjpeg sans écrire de métadonnées, ou un appareil qui emploie ces tables, donne le même constat.",
  "Seules les tables de libjpeg sont reconnues, à l'identique ; une plateforme qui emploie d'autres tables (mozjpeg, tables propres) n'est pas vue, et la qualité lue n'est pas celle qu'un autre logiciel affiche pour d'autres tables.",
  "Seuls les blocs de métadonnées que lisent les modules du projet sont comptés (EXIF, XMP, IPTC) ; un commentaire JPEG ou un profil de couleur ne comptent pas.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image transmise ou capturée peut être générée, retouchée ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "image.metadonnees"
egal = 0

[[regle.condition]]
observation = "image.jpeg.qualite_ijg"
presente = true
parametre = "qualite"
