description = "JPEG dont les tables de quantification sont exactement l'un des jeux qu'écrit Adobe Photoshop à la qualité 6 (échelle de 0 à 12 de son enregistrement JPEG, ressource 0x0406), relevés sur 17 fichiers de Wikimedia Commons enregistrés par Photoshop (relevé du complément de T40, banc/releves/tables-T40c, ADR-0193, ADR-0195) : 2 jeux de tables, selon la taille de l'image (côté long d'au plus 1 296 ou d'au moins 1 305 pixels sur le relevé). Profil d'un fichier enregistré en dernier par Photoshop (F-30, ADR-0191)."
gabarit = "image.tables-photoshop-6"
phrase = { fr = "L'image JPEG est encodée avec des tables de quantification qu'écrit Adobe Photoshop à la qualité 6 : c'est le profil d'un fichier enregistré en dernier par Photoshop, ou par un autre logiciel d'Adobe qui emploie les mêmes tables (Photoshop Elements, Lightroom)." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "Les tables sont celles du dernier enregistrement : la règle ne dit ni ce que le fichier a subi avant, ni s'il a été retouché dans Photoshop ou seulement réenregistré.",
  "Photoshop Elements et Lightroom écrivent les mêmes tables ; GIMP peut reprendre les tables d'un fichier qu'il réenregistre ; un fichier qui garde ces tables sans être réencodé (rotation sans perte) donne le même constat. Des tables se recopient aussi à dessein.",
  "Relevé sur un échantillon de Wikimedia Commons (ADR-0193) : les niveaux 0, 1, 2 et 4, les jeux trop rares et les enregistrements sans ressource 0x0406 ne sont pas reconnus.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image peut être générée, retouchée ou authentique.",
]
application = "moteur"

