[[regle]]
identifiant = "R-IMAGE-007"
version = "1"
module = "image"
titre = "JPEG sans métadonnées encodé par ffmpeg"
description = "JPEG sans aucun bloc de métadonnées lu par le projet (règles d'absence R-EXIF-013, R-XMP-012 et R-IPTC-002, A-34), dont la table de quantification est exactement celle qu'écrit l'encodeur MJPEG de ffmpeg à un qscale de 1 à 31 : matrice intra par défaut de MPEG-1 multipliée par le qscale puis divisée par 8, coefficient continu à 8 (encode_picture de mpegvideo_enc.c et ff_mpeg1_default_intra_matrix de mpeg12data.c, FFmpeg 7.1). ffmpeg écrit un JPEG par cet encodeur, par exemple pour extraire une image d'une vidéo (F-06, F-30, ADR-0180)."
gabarit = "image.tables-ffmpeg-sans-metadonnees"
phrase = { fr = "L'image JPEG est encodée avec les tables de quantification de l'encodeur MJPEG de ffmpeg au qscale {qscale} et ne porte aucune métadonnée : c'est le profil d'une image extraite d'une vidéo ou enregistrée par un logiciel qui emploie ffmpeg." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "La règle ne mesure pas une double compression (T41) : une image encodée une seule fois par ffmpeg depuis une source sans perte, une capture d'écran ou un rendu par exemple, donne le même constat.",
  "Seuls les réglages par défaut de la matrice sont reconnus : un qscale au-delà de 31 (qmax relevé), une matrice fournie (intra_matrix, chroma_intra_matrix) ou une autre précision du coefficient continu (dc) ne le sont pas.",
  "Seuls les blocs de métadonnées que lisent les modules du projet sont comptés (EXIF, XMP, IPTC) ; un commentaire JPEG ou un profil de couleur ne comptent pas.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image transmise ou capturée peut être générée, retouchée ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "image.metadonnees"
egal = 0

[[regle.condition]]
observation = "image.jpeg.qscale_ffmpeg"
presente = true
parametre = "qscale"

# Tables relevées du complément de T40 (F-30, ADR-0191 à ADR-0196) : tables de Photoshop par
# niveau et tables d'appareils par marque, relevées sur des originaux de Wikimedia Commons
# (banc/releves/tables-T40c : scripts, tables en clair, fichiers sources et licences). Une
# règle nomme des tables fixes par leur empreinte (ADR-0181) ; aucune condition sur les
# métadonnées (ADR-0192).

[[regle]]
identifiant = "R-IMAGE-008"
version = "1"
module = "image"
titre = "JPEG aux tables de quantification d'Adobe Photoshop, qualité 3"
description = "JPEG dont les tables de quantification sont exactement l'un des jeux qu'écrit Adobe Photoshop à la qualité 3 (échelle de 0 à 12 de son enregistrement JPEG, ressource 0x0406), relevés sur 6 fichiers de Wikimedia Commons enregistrés par Photoshop (relevé du complément de T40, banc/releves/tables-T40c, ADR-0193, ADR-0195) : 1 jeu de tables. Profil d'un fichier enregistré en dernier par Photoshop (F-30, ADR-0191)."
gabarit = "image.tables-photoshop-3"
phrase = { fr = "L'image JPEG est encodée avec des tables de quantification qu'écrit Adobe Photoshop à la qualité 3 : c'est le profil d'un fichier enregistré en dernier par Photoshop, ou par un autre logiciel d'Adobe qui emploie les mêmes tables (Photoshop Elements, Lightroom)." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "Les tables sont celles du dernier enregistrement : la règle ne dit ni ce que le fichier a subi avant, ni s'il a été retouché dans Photoshop ou seulement réenregistré.",
  "Photoshop Elements et Lightroom écrivent les mêmes tables ; GIMP peut reprendre les tables d'un fichier qu'il réenregistre ; un fichier qui garde ces tables sans être réencodé (rotation sans perte) donne le même constat. Des tables se recopient aussi à dessein.",
  "Relevé sur un échantillon de Wikimedia Commons (ADR-0193) : les niveaux 0, 1, 2 et 4, les jeux trop rares et les enregistrements sans ressource 0x0406 ne sont pas reconnus.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image peut être générée, retouchée ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "image.jpeg.empreinte_tables"
parmi = [
