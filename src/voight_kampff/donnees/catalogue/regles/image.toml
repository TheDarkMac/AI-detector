# Recompression (F-06), partie de T40 avancée (F-30, ADR-0153) : tables de quantification de
# libjpeg (jcparam.c, annexe K de T.81), reconnues à une qualité de 1 à 100.

[[regle]]
identifiant = "R-IMAGE-004"
version = "2"
module = "image"
titre = "JPEG sans métadonnées encodé aux tables de libjpeg"
description = "JPEG sans aucun bloc de métadonnées lu par le projet (règles d'absence R-EXIF-013, R-XMP-012 et R-IPTC-002, A-34), dont les tables de quantification sont exactement celles qu'écrit la bibliothèque libjpeg de l'IJG à une qualité de 1 à 100 (annexe K de T.81, mise à l'échelle de jcparam.c) : profil d'une image réencodée par un logiciel courant, ce que font les messageries et les réseaux sociaux qui recompressent toujours les images reçues (Giudice et al. 2016, tableau III) (F-06, F-30, ADR-0153)."
gabarit = "image.tables-libjpeg-sans-metadonnees"
phrase = { fr = "L'image JPEG est encodée avec les tables de quantification de la bibliothèque libjpeg à la qualité {qualite} et ne porte aucune métadonnée : c'est le profil d'une image réenregistrée par un logiciel courant, comme le font des messageries et des réseaux sociaux." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "La règle ne mesure pas une double compression (T41) : un fichier encodé une seule fois par un logiciel ou un générateur qui emploie libjpeg sans écrire de métadonnées, ou un appareil qui emploie ces tables, donne le même constat.",
  "Seules les tables de libjpeg à une même qualité sont reconnues par cette règle, à l'identique ; les tables de libjpeg à deux qualités, de mozjpeg et de ffmpeg ont leurs propres règles (R-IMAGE-005 à R-IMAGE-007, T40) ; une plateforme qui emploie d'autres tables (tables propres) n'est pas vue, et la qualité lue n'est pas celle qu'un autre logiciel affiche pour d'autres tables.",
  "Seuls les blocs de métadonnées que lisent les modules du projet sont comptés (EXIF, XMP, IPTC) ; un commentaire JPEG ou un profil de couleur ne comptent pas.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image transmise ou capturée peut être générée, retouchée ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "image.metadonnees"
egal = 0

[[regle.condition]]
observation = "image.jpeg.qualite_ijg"
presente = true
parametre = "qualite"

# Tables connues de T40 (F-30, ADR-0180 à ADR-0183) : libjpeg à deux qualités (rdswitch.c de
# libjpeg-turbo), jeux 2 à 8 de mozjpeg 4.1.1 (jcparam.c), encodeur MJPEG de ffmpeg 7.1
# (mpegvideo_enc.c, mpeg12data.c). Même forme que R-IMAGE-004 (ADR-0182) ; le module observe le
# premier encodeur reconnu, dans cet ordre : libjpeg, libjpeg à deux qualités, mozjpeg, ffmpeg.

[[regle]]
identifiant = "R-IMAGE-005"
version = "1"
module = "image"
titre = "JPEG sans métadonnées encodé aux tables de libjpeg à deux qualités"
description = "JPEG sans aucun bloc de métadonnées lu par le projet (règles d'absence R-EXIF-013, R-XMP-012 et R-IPTC-002, A-34), dont la table de luminance est exactement celle qu'écrit la bibliothèque libjpeg de l'IJG à une qualité, et la table de chrominance celle qu'elle écrit à une autre qualité : réglage d'un encodeur qui fixe les deux qualités à part (cjpeg -quality 90,70, q_scale_factor de l'interface de libjpeg 7 et suivantes ; rdswitch.c et jcparam.c de libjpeg-turbo) (F-06, F-30, ADR-0180)."
gabarit = "image.tables-libjpeg-deux-qualites-sans-metadonnees"
phrase = { fr = "L'image JPEG est encodée avec les tables de quantification de la bibliothèque libjpeg à la qualité {luminance} pour la luminance et {chrominance} pour la chrominance, et ne porte aucune métadonnée : c'est le profil d'une image réenregistrée par un logiciel qui emploie cette bibliothèque." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "La règle ne mesure pas une double compression (T41) : un fichier encodé une seule fois par un logiciel ou un générateur qui emploie libjpeg ainsi réglée, sans écrire de métadonnées, donne le même constat.",
  "En huit bits, les qualités 1 à 3 de la chrominance donnent la même table : la règle ne relève pas alors deux qualités ; seules les tables 0 et 1 sont lues, et seules des qualités entières de 1 à 100 sont reconnues.",
  "Seuls les blocs de métadonnées que lisent les modules du projet sont comptés (EXIF, XMP, IPTC) ; un commentaire JPEG ou un profil de couleur ne comptent pas.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image transmise ou capturée peut être générée, retouchée ou authentique.",
]
application = "moteur"

[[regle.condition]]
observation = "image.metadonnees"
egal = 0

[[regle.condition]]
observation = "image.jpeg.qualite_ijg_luminance"
presente = true
parametre = "luminance"

[[regle.condition]]
observation = "image.jpeg.qualite_ijg_chrominance"
presente = true
parametre = "chrominance"

[[regle]]
identifiant = "R-IMAGE-006"
version = "1"
module = "image"
titre = "JPEG sans métadonnées encodé aux tables de mozjpeg"
description = "JPEG sans aucun bloc de métadonnées lu par le projet (règles d'absence R-EXIF-013, R-XMP-012 et R-IPTC-002, A-34), dont les tables de quantification sont exactement celles qu'écrit l'encodeur mozjpeg avec l'un de ses jeux 2 à 8 à une qualité de 1 à 100 (std_luminance_quant_tbl et std_chrominance_quant_tbl de jcparam.c, mozjpeg 4.1.1 ; le jeu 3, table de N. Robidoux, est celui du profil par défaut) : profil d'une image réencodée par un logiciel qui emploie mozjpeg (F-06, F-30, ADR-0180)."
gabarit = "image.tables-mozjpeg-sans-metadonnees"
phrase = { fr = "L'image JPEG est encodée avec le jeu de tables {jeu} de l'encodeur mozjpeg à la qualité {qualite} et ne porte aucune métadonnée : c'est le profil d'une image réenregistrée par un logiciel qui emploie cet encodeur." }
categorie = "indice"
direction = "transformation"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "La règle ne mesure pas une double compression (T41) : un fichier encodé une seule fois par un logiciel ou un générateur qui emploie mozjpeg sans écrire de métadonnées donne le même constat.",
  "Le jeu 0 de mozjpeg est celui de libjpeg (R-IMAGE-004) ; le jeu 1, plat, n'est pas reconnu, parce que plusieurs qualités y donnent la même table ; une qualité fractionnaire (cjpeg de mozjpeg l'accepte) ou des qualités différentes pour la luminance et la chrominance ne sont pas reconnues.",
  "Seuls les blocs de métadonnées que lisent les modules du projet sont comptés (EXIF, XMP, IPTC) ; un commentaire JPEG ou un profil de couleur ne comptent pas.",
  "Le constat dit qu'une étape de transformation a eu lieu, pas ce qu'était le fichier avant : l'image transmise ou capturée peut être générée, retouchée ou authentique.",
]
application = "moteur"

