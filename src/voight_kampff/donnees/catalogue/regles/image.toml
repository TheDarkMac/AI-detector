[[regle]]
identifiant = "R-IMAGE-017"
version = "1"
module = "image"
titre = "JPEG aux tables de quantification d'appareils Apple"
description = "JPEG dont les tables de quantification sont exactement l'un des 2 jeux relevés sur 9 photos originales d'appareils Apple (modèles iPhone, iPhone 4) versées sur Wikimedia Commons, chaque jeu par au moins 2 comptes et sur la seule marque, jamais sur un fichier de Photoshop (relevé du complément de T40, banc/releves/tables-T40c, ADR-0193, ADR-0194). Profil d'une image dont la dernière compression est celle d'un appareil de cette marque (F-30, ADR-0191)."
gabarit = "image.tables-appareils-apple"
phrase = { fr = "L'image JPEG est encodée avec des tables de quantification relevées sur des photos originales d'appareils Apple : c'est le profil d'un fichier dont la dernière compression est celle d'un appareil, sans réenregistrement par un logiciel qui change les tables." }
categorie = "indice"
direction = "authenticite"
fondement = "verification_deterministe"
niveau = "faible"
limites = [
  "Des tables d'appareil se recopient : un logiciel qui garde les tables de l'original (rotation sans perte, GIMP avec la qualité de l'original) donne le même constat, et un fichier peut recevoir ces tables à dessein.",
  "Les tables sont communes à des familles d'appareils de la marque : la règle ne nomme pas le modèle et ne compare pas les tables avec l'appareil déclaré dans l'EXIF.",
  "Relevé sur un échantillon de Wikimedia Commons (ADR-0193) : les appareils rares, et les 28 modèles du relevé qui semblent calculer leurs tables pour chaque image (reflex Nikon, compacts Olympus et Fujifilm notamment, ADR-0194), ne sont pas reconnus.",
  "Le constat dit seulement que la dernière compression est celle d'un appareil : il ne dit rien de ce que montre l'image (une scène mise en scène, un écran photographié) ni d'une modification faite sans réencodage.",
]
application = "moteur"

