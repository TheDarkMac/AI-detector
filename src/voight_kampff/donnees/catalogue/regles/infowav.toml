# Règles du module infowav (T22) : nom d'un générateur dans un champ logiciel (F-12, ADR-0144).

[[regle]]
identifiant = "R-INFOWAV-001"
version = "1"
module = "infowav"
titre = "Générateur nommé par le logiciel d'un WAV"
description = "Le sous-bloc ISFT (logiciel) de la liste INFO nomme un logiciel de génération par IA de la liste du catalogue (ADR-0144) : Midjourney, DALL·E, Stable Diffusion, Adobe Firefly, ComfyUI, InvokeAI, NovelAI, AUTOMATIC1111, Fooocus, Leonardo.Ai, Ideogram, Craiyon, DreamStudio, ChatGPT, Suno, Udio, ElevenLabs."
gabarit = "infowav.logiciel-generateur"
phrase = { fr = "Le sous-bloc ISFT de la liste INFO du WAV, qui nomme le logiciel, vaut « {logiciel} » : on y lit le nom d'un logiciel de génération par IA." }
categorie = "indice"
direction = "origine_ia"
fondement = "declaration"
niveau = "faible"
limites = [
  "Déclaration du fichier : quiconque peut écrire ou effacer ce sous-bloc ; son absence ne dit rien (F-14).",
  "Seuls les noms de la liste sont reconnus, entiers et sans faute ; un générateur qui n'écrit pas son nom, ou l'écrit autrement, n'est pas vu.",
  "Le constat dit ce que le champ nomme, pas ce que le logiciel a fait : un générateur peut aussi avoir servi à retoucher ou à convertir le fichier.",
]
application = "moteur"

[[regle.condition]]
observation = "infowav.ISFT"
motif = '(?i)\b(?:midjourney|dall[-·‧ ]e|stable[- ]?diffusion|adobe firefly|comfyui|invoke[- ]?ai|novelai|automatic1111|fooocus|leonardo\.ai|ideogram|craiyon|dreamstudio|chatgpt|suno|udio|elevenlabs)\b'
parametre = "logiciel"

# Règle de T23 : absence de métadonnées, information neutre (F-14, ADR-0151).

[[regle]]
identifiant = "R-INFOWAV-002"
version = "1"
module = "infowav"
titre = "Aucune métadonnée RIFF (INFO, bext)"
description = "Le module infowav n'a trouvé aucune métadonnée RIFF (INFO, bext) (listes INFO et bloc bext du WAV) : l'observation infowav.present vaut faux. Information neutre (F-14, A-34, ADR-0151) : elle ne compte ni pour ni contre une origine IA."
gabarit = "infowav.absence"
phrase = { fr = "Le fichier ne porte aucune métadonnée RIFF (INFO, bext). Cette absence est fréquente (messageries, réseaux sociaux, conversions) et ne dit rien de son origine." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "verification_deterministe"
limites = [
  "Absence neutre : beaucoup de logiciels, messageries et plateformes retirent ces métadonnées, et beaucoup de générateurs n'en écrivent pas ; elle n'est ni un indice d'IA ni une garantie d'authenticité (F-14, P-04).",
  "Seuls les emplacements de la fiche du module sont lus : des métadonnées logées ailleurs dans le fichier ne sont pas vues.",
]
application = "moteur"

[[regle.condition]]
observation = "infowav.present"
egal = false
