# Règles du module ooxml (T22) : nom d'un générateur dans un champ logiciel (F-12, ADR-0144).

[[regle]]
identifiant = "R-OOXML-001"
version = "1"
module = "ooxml"
titre = "Générateur nommé par l'application d'un DOCX"
description = "La propriété étendue Application (docProps/app.xml) nomme un logiciel de génération par IA de la liste du catalogue (ADR-0144) : Midjourney, DALL·E, Stable Diffusion, Adobe Firefly, ComfyUI, InvokeAI, NovelAI, AUTOMATIC1111, Fooocus, Leonardo.Ai, Ideogram, Craiyon, DreamStudio, ChatGPT, Suno, Udio, ElevenLabs."
gabarit = "ooxml.logiciel-generateur"
phrase = { fr = "La propriété Application du DOCX, qui nomme le logiciel, vaut « {logiciel} » : on y lit le nom d'un logiciel de génération par IA." }
categorie = "indice"
direction = "origine_ia"
fondement = "declaration"
niveau = "faible"
limites = [
  "Déclaration du fichier : quiconque peut écrire ou effacer cette propriété ; son absence ne dit rien (F-14).",
  "Seuls les noms de la liste sont reconnus, entiers et sans faute ; un générateur qui n'écrit pas son nom, ou l'écrit autrement, n'est pas vu.",
  "Le constat dit ce que le champ nomme, pas ce que le logiciel a fait : un générateur peut aussi avoir servi à retoucher ou à convertir le fichier.",
]
application = "moteur"

[[regle.condition]]
observation = "ooxml.app.Application"
motif = '(?i)\b(?:midjourney|dall[-·‧ ]e|stable[- ]?diffusion|adobe firefly|comfyui|invoke[- ]?ai|novelai|automatic1111|fooocus|leonardo\.ai|ideogram|craiyon|dreamstudio|chatgpt|suno|udio|elevenlabs)\b'
parametre = "logiciel"

# Règles de T23 : incohérences internes (F-13, ADR-0147 à ADR-0150) et absence (F-14,
# ADR-0151), toutes des informations neutres.

[[regle]]
identifiant = "R-OOXML-002"
version = "1"
module = "ooxml"
titre = "Date de création impossible (dcterms:created)"
description = "La valeur de La date de création du document (dcterms:created) suit l'écriture ISO 8601 (AAAA-MM-JJThh:mm:ss et fuseau), mais la date qu'elle écrit n'existe pas dans le calendrier (mois, jour, heure, minute ou seconde hors de son domaine, fuseau impossible) : dates impossibles de F-13 (ADR-0150)."
gabarit = "ooxml.date-creation-impossible"
phrase = { fr = "La date de création du document (dcterms:created) vaut « {date} », une date qui n'existe pas dans le calendrier." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : une horloge mal réglée, un logiciel qui recopie ou réécrit une date, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Seule une date qui suit l'écriture et n'existe pas dans le calendrier est relevée ; une date d'une autre écriture, ou qui dit une date inconnue, ne l'est pas (ADR-0148).",
]
application = "moteur"

[[regle.condition]]
observation = "ooxml.core.dcterms:created"
impossible = true
lecture = "date-iso8601"
parametre = "date"

[[regle]]
identifiant = "R-OOXML-003"
version = "1"
module = "ooxml"
titre = "Date de modification impossible (dcterms:modified)"
description = "La valeur de La date de modification du document (dcterms:modified) suit l'écriture ISO 8601 (AAAA-MM-JJThh:mm:ss et fuseau), mais la date qu'elle écrit n'existe pas dans le calendrier (mois, jour, heure, minute ou seconde hors de son domaine, fuseau impossible) : dates impossibles de F-13 (ADR-0150)."
gabarit = "ooxml.date-modification-impossible"
phrase = { fr = "La date de modification du document (dcterms:modified) vaut « {date} », une date qui n'existe pas dans le calendrier." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : une horloge mal réglée, un logiciel qui recopie ou réécrit une date, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Seule une date qui suit l'écriture et n'existe pas dans le calendrier est relevée ; une date d'une autre écriture, ou qui dit une date inconnue, ne l'est pas (ADR-0148).",
]
application = "moteur"

[[regle.condition]]
observation = "ooxml.core.dcterms:modified"
impossible = true
lecture = "date-iso8601"
parametre = "date"

[[regle]]
identifiant = "R-OOXML-004"
version = "1"
module = "ooxml"
titre = "Création postérieure à la modification (dcterms:created, dcterms:modified)"
description = "La date de création du document (dcterms:created) est postérieure à la date de modification du document (dcterms:modified), pour tous les instants que peuvent désigner les deux dates, lues selon l'écriture ISO 8601 (AAAA-MM-JJThh:mm:ss et fuseau) : l'ordre que fixe leur définition est renversé, l'une des deux au moins est inexacte (F-13, ADR-0150)."
gabarit = "ooxml.creation-apres-modification"
phrase = { fr = "La date de création du document (dcterms:created), « {creation} », est postérieure à la date de modification du document (dcterms:modified), « {modification} », quel que soit le fuseau horaire : l'une des deux au moins est inexacte." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "declaration"
limites = [
  "Déclaration du fichier : une horloge mal réglée, un logiciel qui recopie ou réécrit une date, ou une modification volontaire donnent la même incohérence ; la règle ne dit pas laquelle (ADR-0149).",
  "Une date sans fuseau est lue dans tous les fuseaux, de UTC-12 à UTC+14 : un écart de moins de 26 heures entre deux dates sans fuseau n'est pas relevé (ADR-0148).",
  "Une valeur qui ne suit pas l'écriture de la date, ou qui dit une date inconnue, n'est pas comparée (ADR-0148).",
]
application = "moteur"

[[regle.condition]]
observation = "ooxml.core.dcterms:created"
lecture = "date-iso8601"
parametre = "creation"
comparer = { observation = "ooxml.core.dcterms:modified", operateur = ">", parametre = "modification" }

[[regle]]
identifiant = "R-OOXML-005"
version = "1"
module = "ooxml"
titre = "Aucune propriété de document OOXML"
description = "Le module ooxml n'a trouvé aucune propriété de document OOXML (parties de propriétés désignées par les relations du paquet) : l'observation ooxml.present vaut faux. Information neutre (F-14, A-34, ADR-0151) : elle ne compte ni pour ni contre une origine IA."
gabarit = "ooxml.absence"
phrase = { fr = "Le fichier ne porte aucune propriété de document OOXML. Cette absence est fréquente (messageries, réseaux sociaux, conversions) et ne dit rien de son origine." }
categorie = "information_neutre"
direction = "rien_de_particulier"
fondement = "verification_deterministe"
limites = [
  "Absence neutre : beaucoup de logiciels, messageries et plateformes retirent ces métadonnées, et beaucoup de générateurs n'en écrivent pas ; elle n'est ni un indice d'IA ni une garantie d'authenticité (F-14, P-04).",
  "Seuls les emplacements de la fiche du module sont lus : des métadonnées logées ailleurs dans le fichier ne sont pas vues.",
]
application = "moteur"

[[regle.condition]]
observation = "ooxml.present"
egal = false
