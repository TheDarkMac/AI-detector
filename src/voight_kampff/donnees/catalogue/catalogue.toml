# inscrite au registre docs/catalogue/versions.toml (procédure : docs/catalogue/README.md).

format = 2
version = "0.4.0"
date = "2026-11-14"
description = "Origine IA déclarée et signatures de générateurs (T22), indices faibles fondés sur une déclaration du fichier ; incohérences internes (T23) : dates impossibles, dates dans un ordre renversé, appareil déclaré avec un générateur nommé ou des dimensions de générateur, et absence de métadonnées, toutes des informations neutres. Indices de transfert (T24), faibles, vers la transformation : capture d'écran déclarée (macOS et iOS, gnome-screenshot), marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou encodé aux tables de libjpeg. Format 2 : lecture des dates et comparaison de deux observations."
