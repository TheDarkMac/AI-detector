format = 3
version = "0.14.0"
date = "2026-11-17"
description = "Origine IA déclarée, signatures de générateurs (T22), indices faibles ; incohérences et absence de métadonnées (T23), neutres. Indices faibles vers la transformation (T24, T40, T41) : capture d'écran déclarée, marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou aux tables d'un encodeur connu ; tables d'Adobe Photoshop ; double compression JPEG. Tables d'appareils, indice faible vers l'authenticité (T40). C2PA (T30) : état de la vérification, neutre ; source numérique déclarée, preuve sous un signataire reconnu, indice faible sinon ; contenu changé, indice faible vers la transformation. Filigrane dwtDct de SD 1, SDXL, FLUX.1 (T32), indice faible vers l'origine IA. PDF : versions (T50), éléments actifs, images (T52, T53), neutres ; indices faibles vers la retouche : objets non reconnus changés, signés ou non (T50), texte sur texte, cache, police incorporée plusieurs fois, codes hors plage (T51). Marquages recherchés (T31) : C2PA, IPTC, dwtDct. Format 3 (dates, comparaisons, marquages)."
