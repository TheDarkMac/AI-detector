# Catalogue de règles de Voight-Kampff : en-tête (ADR-0029, ADR-0038, ADR-0085, ADR-0088).
#
# Les règles sont dans regles/<module>.toml, les marquages dans marquages.toml ; tout est public (ADR-0019). Toute modification
# d'un fichier de ce dossier change l'empreinte du catalogue : elle exige une nouvelle version,
# inscrite au registre docs/catalogue/versions.toml (procédure : docs/catalogue/README.md).

format = 3
version = "0.8.0"
date = "2026-11-15"
description = "Origine IA déclarée et signatures de générateurs (T22), indices faibles ; incohérences internes et absence de métadonnées (T23), informations neutres. Indices faibles vers la transformation (T24, T40) : capture d'écran déclarée (macOS, iOS, gnome-screenshot), marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou aux tables d'un encodeur connu (libjpeg, mozjpeg, ffmpeg). Manifeste C2PA (T30), règles du module c2pa : état de la vérification, en information neutre ; source numérique déclarée, en preuve sous un signataire reconnu par la liste de confiance, en indice faible sinon ; contenu changé depuis la signature, indice faible vers la transformation. Double compression JPEG (T41) : trace d'une quantification antérieure dans la luminance, indice faible vers la transformation. Marquages (T31) : C2PA et type de source IPTC recherchés, filigranes inventoriés non recherchés. Format 3 : dates, comparaisons, marquages."
