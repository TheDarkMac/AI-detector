# Catalogue de règles de Voight-Kampff : en-tête (ADR-0029, ADR-0038, ADR-0085, ADR-0088).
#
# Les règles sont dans regles/<module>.toml, les marquages dans marquages.toml ; tout est public (ADR-0019). Toute modification
# d'un fichier de ce dossier change l'empreinte du catalogue : elle exige une nouvelle version,
# inscrite au registre docs/catalogue/versions.toml (procédure : docs/catalogue/README.md).

format = 3
version = "0.10.0"
date = "2026-11-16"
description = "Origine IA déclarée et signatures de générateurs (T22), indices faibles ; incohérences internes et absence de métadonnées (T23), informations neutres. Indices faibles vers la transformation (T24, T40) : capture d'écran déclarée, marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou aux tables d'un encodeur connu (libjpeg, mozjpeg, ffmpeg) ; JPEG aux tables d'Adobe Photoshop (niveaux 3, 5 à 12). Tables d'appareils Apple, Canon, Kodak, Olympus, Panasonic et Sony, indice faible vers l'authenticité (complément de T40). Manifeste C2PA (T30) : état de la vérification, information neutre ; source numérique déclarée, preuve sous un signataire reconnu, indice faible sinon ; contenu changé, indice faible vers la transformation. Double compression JPEG (T41), indice faible vers la transformation. Filigrane dwtDct de SD 1, SDXL et FLUX.1 (T32), indice faible vers l'origine IA. Marquages (T31) : C2PA, IPTC et dwtDct recherchés. Format 3 : dates, comparaisons, marquages."
