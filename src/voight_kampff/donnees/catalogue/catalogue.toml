# inscrite au registre docs/catalogue/versions.toml (procédure : docs/catalogue/README.md).

format = 3
version = "0.18.0"
date = "2026-11-19"
description = "Origine IA déclarée, signature de générateur (T22) : indices faibles ; incohérences et absence de métadonnées (T23), neutres. Indices faibles vers la transformation (T24, T40, T41) : capture d'écran déclarée, marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou aux tables d'encodeurs connus ; tables d'Adobe Photoshop ; double compression. Tables d'appareils : indice faible vers l'authenticité (T40). C2PA (T30) : vérification neutre, source numérique déclarée : preuve sous un signataire reconnu, sinon indice faible ; contenu changé : indice faible vers la transformation. Filigrane dwtDct de SD, SDXL, FLUX.1 (T32) : indice faible vers l'origine IA. Éléments actifs (PDF, DOCX, ODT), versions, images d'un PDF (T50, T52, T53), invisibles, homoglyphes, texte masqué ou invisible (T80, T53), neutres ; PDF, indices faibles de retouche : objets non reconnus changés (T50), texte sur texte, cache, police en double, codes hors plage (T51). Marquages recherchés : C2PA (fichier, texte), IPTC, dwtDct."
