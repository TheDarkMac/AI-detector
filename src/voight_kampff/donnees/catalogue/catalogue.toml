description = "Niveaux des indices fixés par leur taux de faux positifs mesuré sur la partie évaluation du corpus de référence 1.0.0 (T101) : 38 forts, 15 modérés, 10 faibles. Origine IA déclarée, signature de générateur (T22) ; incohérences et absence de métadonnées (T23), neutres. Vers la transformation (T24, T40, T41) : capture d'écran déclarée, marque de Facebook, JPEG sans métadonnées aux dimensions d'une messagerie ou aux tables d'encodeurs connus, tables d'Adobe Photoshop, double compression ; tables d'appareils vers l'authenticité (T40). C2PA (T30) : vérification neutre, source numérique déclarée : preuve sous un signataire reconnu, sinon indice. Filigrane dwtDct de SD, SDXL, FLUX.1 (T32). Éléments actifs et images (PDF, DOCX, ODT), versions, invisibles, texte masqué, historique d'édition (T50 à T53, T80, T81), neutres ; PDF, indices de retouche (T50, T51). Marquages recherchés : C2PA, IPTC, dwtDct."
